[package]
name = "anapaya-ead-models"
version = "0.7.0"
edition.workspace = true
authors = ["Anapaya & contributors"]
license = "Apache-2.0"
description = "Protobuf definitions for the SCION endhost API"
repository = "https://github.com/anapaya/scion-sdk"
keywords = ["SCION", "networking"]

[features]
# The generated protobuf-JSON impls need serde, so they share the protobuf gate.
protobuf = ["buffa", "serde"]
default = ["protobuf"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

buffa = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true, optional = true }

[lints]
workspace = true
