[package]
name = "snap-tokens"
version = "0.7.0"
edition.workspace = true
authors = ["Anapaya & contributors"]
license = "Apache-2.0"
description = "AuthN/AuthZ tokens used in the SNAP transport underlay for SCION"
repository = "https://github.com/anapaya/scion-sdk"
keywords = ["SCION", "networking"]
categories = ["network-programming"]

[features]
# Serves the constant test key over HTTP, for tests that require a JWKS endpoint.
jwks-server = ["dep:axum", "dep:tokio", "dep:url"]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
pem = { workspace = true }
scion-sdk-token-validator = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }

[lints]
workspace = true
