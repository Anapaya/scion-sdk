# Keep this file identical in the sibling workspaces:
#   ./clippy.toml, endhost/anapaya/clippy.toml, endhost/public/clippy.toml

too-many-arguments-threshold = 10
large-error-threshold = 256

disallowed-methods = [
    { path = "std::io::Write::write", reason = "`Write::write()` can write a part of the buffer only. Use `Write::write_all()`." },
    { path = "tokio::io::AsyncWriteExt::write", reason = "`AsyncWriteExt::write()` can write a part of the buffer only. Use `AsyncWriteExt::write_all()`." },
    { path = "tokio::task::block_in_place", reason = "`block_in_place()` panics if the Tokio scheduler cannot move the other tasks. Use `spawn_blocking()`, or change the design." },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "An unbounded channel can grow without a limit. Use `tokio::sync::mpsc::channel()` with a capacity." },
    { path = "futures_channel::mpsc::unbounded", reason = "An unbounded channel can grow without a limit. Use `futures::channel::mpsc::channel()` with a capacity." },
    { path = "crossbeam_channel::unbounded", reason = "An unbounded channel can grow without a limit. Use `crossbeam::channel::bounded()` with a capacity." },
    { path = "std::thread::sleep", reason = "`thread::sleep()` blocks the Tokio worker thread. Use `tokio::time::sleep().await` in the async code." },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "This function does a blocking DNS lookup. Use `tokio::net::lookup_host()` in the async code." },
    { path = "tokio::sync::Mutex::blocking_lock", reason = "This function panics in the async context. Use `.lock().await`." },
    { path = "tokio::sync::mpsc::Receiver::blocking_recv", reason = "This function panics in the async context. Use `.recv().await`." },
    { path = "tokio::sync::mpsc::Sender::blocking_send", reason = "This function panics in the async context. Use `.send().await`." },
]
