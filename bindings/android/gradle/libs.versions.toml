# One place for the libraries both modules use. JNA is how the bindings reach the native library at
# all, and coroutine cancellation is what turns a cancelled call into a cancelled HTTP/3 request.
# The JVM-host tests assert that behaviour, so the versions they measure have to be the versions the
# AAR ships, which is what keeping them here guarantees.

[versions]
jna = "5.14.0"
kotlinx-coroutines = "1.7.3"
junit = "5.10.2"
androidx-test = "1.6.2"
androidx-test-junit = "1.2.1"
# Test-only: reads the one line of JSON the test server prints, and its control API's replies.
gson = "2.11.0"

[libraries]
# The @aar classifier matters on Android: that artifact carries JNA's own native libraries per ABI,
# which the plain jar does not.
jna-android = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# The Android artifact of the same library, for Dispatchers.Main. The AAR exposes only the core
# one, so an application adds this itself; the sample app does what a consumer does.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
