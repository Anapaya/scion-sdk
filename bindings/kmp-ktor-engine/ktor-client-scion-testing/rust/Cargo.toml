[package]
name = "ktor-scion-testing"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A PocketSCION topology for tests of the Ktor SCION engine, as a UniFFI library"
repository = "https://github.com/anapaya/scion-sdk"

[package.metadata.release]
publish = false

[lib]
name = "ktor_scion_testing"
# cdylib feeds the JVM and Android. staticlib feeds Kotlin/Native. rlib feeds the
# integration tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
axum = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["server", "service", "tokio"] }
pocketscion = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
scion-h3-axum = { workspace = true }
scion-quic = { workspace = true }
scion-sdk-utils = { workspace = true }
scion-stack = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
# Not the workspace entry. Gobley installs uniffi_bindgen 0.29, and the
# library must match it.
uniffi = "=0.29.4"

[dev-dependencies]
scion-http3 = { workspace = true }

[lints]
workspace = true
