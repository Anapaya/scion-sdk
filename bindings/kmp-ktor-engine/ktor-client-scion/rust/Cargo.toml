[package]
name = "ktor-scion-core"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "scion-http3 behind a UniFFI interface, for the Ktor SCION engine"
repository = "https://github.com/anapaya/scion-sdk"

[package.metadata.release]
publish = false

[lib]
name = "ktor_scion_core"
# staticlib feeds Kotlin/Native. cdylib feeds the JVM and Android.
crate-type = ["cdylib", "staticlib"]

[dependencies]
anapaya-aa-client = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# The WebGateway transport.
boring = { workspace = true }
http-body-util = { workspace = true }
hyper-boring = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
scion-http3 = { workspace = true }
scion-sdk-utils = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-boring = { workspace = true }
tower-service = { workspace = true }
# Not the workspace entry. Gobley installs uniffi_bindgen 0.29, and the
# library must match it.
uniffi = "=0.29.4"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
