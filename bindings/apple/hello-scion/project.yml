# The XcodeGen spec of the sample app. `xcodegen generate` writes HelloScion.xcodeproj from it.
name: HelloScion
options:
  bundleIdPrefix: com.anapaya.scion.http3
  deploymentTarget:
    iOS: "15.0"
packages:
  # A consumer names the released package by URL instead; see the README.
  scion-http3-swift:
    path: ../scion-http3-swift
targets:
  HelloScion:
    type: application
    platform: iOS
    sources:
      - HelloScion
    dependencies:
      - package: scion-http3-swift
        product: ScionHTTP3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anapaya.scion.http3.hello
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  HelloScion:
    build:
      targets:
        HelloScion: all
    run:
      config: Debug
